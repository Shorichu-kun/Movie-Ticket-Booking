<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý phim · N6 Cinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-neon.css">
    <script src="../js/session.js"></script>
    <script src="../js/admin-guard.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/movie-admin.js" defer></script>
</head>
<body class="neon" data-admin-shell>
<div class="n-shell">
    <aside class="n-side n-card" id="side"></aside>
    <main>
        <div class="n-tiles" id="tiles" data-active="movies.html"></div>
        <section class="n-card">
            <div class="n-head">
                <div><h1>Quản lý phim</h1><div class="n-sub">Thêm, sửa, xóa phim · kéo thả ảnh bìa</div></div>
                <div style="display:flex;gap:8px">
                    <input class="n-in" id="q" type="search" placeholder="Tìm phim…" style="width:190px">
                    <button class="n-btn" id="add">+ Thêm phim</button>
                </div>
            </div>
            <div class="n-pills" id="tabs"></div>
            <div class="n-tw">
                <table>
                    <thead><tr><th></th><th>Tên phim</th><th>Thời lượng</th><th>Thể loại</th><th>Độ tuổi</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="n-pager" id="pager"></div>
        </section>
    </main>
</div>
<div class="n-ov" id="ov"><div class="n-md" id="md"></div></div>
</body>
</html>
