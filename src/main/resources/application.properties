customers.storage-path=${CUSTOMERS_STORAGE_PATH:${cinema.data-dir}/customers.json}
customers.discount.student=${STUDENT_DISCOUNT_RATE:0.10}
customers.discount.vip=${VIP_DISCOUNT_RATE:0.20}

accounts.storage-path=${ACCOUNTS_STORAGE_PATH:${cinema.data-dir}/accounts.json}
cinema.data-dir=${CINEMA_DATA_DIR:data}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

commerce.demo-enabled=${COMMERCE_DEMO_ENABLED:true}
# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
