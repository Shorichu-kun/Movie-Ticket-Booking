<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phim - Sample Module</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }


        .page-header {
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.03em;
            margin: 0 0 10px 0;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: #6366f1;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            padding: 6px 12px;
            background: #eeef2e10;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: #4f46e5;
            background: #6366f115;
            transform: translateX(3px);
        }


        .container {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }

        .form-section, .list-section {
            background: #ffffff;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05), 0 4px 12px -4px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .form-section { flex: 1; }
        .list-section { flex: 2; overflow: hidden; }

        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #334155;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }


        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }


        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }


        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 12px;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border: none;
            text-align: left;
        }

        th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

        td {
            padding: 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }


        .btn-delete {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: auto;
        }

        .btn-delete:hover {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

<div class="page-header">
    <h1>🎬 Hệ Thống Đặt Vé Phim - Module 1 (Movie Sample)</h1>
    <a href="customers.html" class="nav-link">Quản lý khách hàng →</a>
</div>

<div class="container">
    <!-- FORM THÊM PHIM MỚI -->
    <div class="form-section">
        <h2>Thêm Phim Mới</h2>
        <form id="movieForm">
            <div class="form-group">
                <label>Mã Phim (ID)</label>
                <input type="text" id="movieId" placeholder="VD: MOV03" required>
            </div>
            <div class="form-group">
                <label>Tên Phim</label>
                <input type="text" id="title" placeholder="Tên bộ phim..." required>
            </div>
            <div class="form-group">
                <label>Thời lượng (Phút)</label>
                <input type="number" id="duration" placeholder="120" required>
            </div>
            <div class="form-group">
                <label>Thể loại</label>
                <input type="text" id="genre" placeholder="Hành động, Hài..." required>
            </div>
            <div class="form-group">
                <label>Trạng thái</label>
                <select id="status">
                    <option value="NOW_SHOWING">Đang chiếu</option>
                    <option value="COMING_SOON">Sắp chiếu</option>
                    <option value="ENDED">Ngừng chiếu</option>
                </select>
            </div>
            <button type="submit">Lưu Phim</button>
        </form>
    </div>

    <!-- DANH SÁCH PHIM -->
    <div class="list-section">
        <h2>Danh Sách Phim Trong Hệ Thống</h2>
        <table>
            <thead>
            <tr>
                <th>Mã</th>
                <th>Tên Phim</th>
                <th>Thời Lượng</th>
                <th>Thể Loại</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
            </thead>
            <tbody id="movieTableBody">
            </tbody>
        </table>
    </div>
</div>

<script src="movies.js"></script>
</body>
</html>
